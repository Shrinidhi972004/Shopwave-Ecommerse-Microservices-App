apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopwave
  labels:
    app: product-service
    app.kubernetes.io/part-of: shopwave
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        app.kubernetes.io/part-of: shopwave
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: product-service
          image: <ecr image>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4002
              protocol: TCP
          env:
            - name: PORT
              value: "4002"
          envFrom:
            - configMapRef:
                name: shopwave-config
            - secretRef:
                name: shopwave-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10